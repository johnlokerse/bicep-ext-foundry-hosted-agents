name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The OCI artifact is tagged with the bare version; the git tag is 'v'-prefixed.
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be cut from 'main', but this run targets '$GITHUB_REF'."
            exit 1
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 0.2.0 or 1.0.0-preview.1, with no leading 'v')."
            exit 1
          fi

          # git ls-remote exits 2 when no ref matches, and other non-zero codes on transport
          # failures - only treat a genuine "not found" as a free version.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag '$TAG' already exists. Releases are immutable - pick a new version."
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Unable to check whether tag '$TAG' exists (git ls-remote exited $status)."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Bicep
        run: |
          az config set bicep.use_binary_from_path=false
          az bicep install --version v0.45.15

      - name: Restore
        run: dotnet restore bicep-ext-foundry-hosted-agents.sln

      - name: Build
        run: dotnet build bicep-ext-foundry-hosted-agents.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test bicep-ext-foundry-hosted-agents.sln --configuration Release --no-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Publish extension
        shell: pwsh
        run: |
          # OCI repository names must be lowercase.
          $target = "br:ghcr.io/$("${{ github.repository }}".ToLowerInvariant()):${env:VERSION}"
          ./Scripts/Publish-Extension.ps1 -Target $target
          "Published extension ``$target``." >> $env:GITHUB_STEP_SUMMARY
        # Bicep reads bicepconfig.json from the working directory; Infra/bicepconfig.json enables
        # 'ociEnabled' so non-ACR registries (ghcr.io) authenticate via Docker credentials.
        working-directory: ./Infra

      - name: Tag release
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args=(--prerelease --latest=false)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --generate-notes \
            "${prerelease_args[@]}"
